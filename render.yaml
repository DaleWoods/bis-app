# Render.com blueprint for the Business Impact Scoring app.
#
# In the Render dashboard: New → Blueprint → this repository. Render reads this
# file, creates the database and the web service, and prompts for the values
# marked below.
#
# This deploys the REAL application on managed PostgreSQL - every feature live,
# nothing stubbed.
#
# Sign-in is name/email: the committee picks their name from a list. That suits
# an internal tool with a known committee, and is a deliberate departure from
# §4 of the requirements (Entra ID SSO) - see docs/decisions.md. Moving
# to SSO later is configuration, not a rewrite; the switch is at the bottom.
#
# JIRA import / write-back goes live when the service-account token is set.
# Until then you add tickets manually or by CSV and export results as CSV.

databases:
  - name: bis-db
    databaseName: bis
    user: bis
    # basic-256mb (not free): Render deletes free-tier databases after 30
    # days and free tier carries no automated backups. This holds the only
    # copy of every round the committee has ever scored - see
    # docs/plans/PLAN-1-data-durability.md for the full reasoning, and the
    # nightly emailed export in backupService.ts as the independent
    # second copy.
    plan: basic-256mb

services:
  - type: web
    name: bis-app
    runtime: node
    # starter = 512MB, which is ample: no browser, no image processing. The
    # PPTX/PDF pack is generated in-process from text.
    plan: starter
    # --include=dev is required: NODE_ENV=production (below) makes npm skip
    # devDependencies, and the build needs TypeScript, @types/node and Vite.
    # Only the build needs them; the running service uses dependencies alone.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # --- Database ------------------------------------------------------
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bis-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

      # --- Session -------------------------------------------------------
      # Render generates this once and keeps it; it never appears in git.
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"

      # --- First way in --------------------------------------------------
      # THE ONE VALUE YOU MUST SET. A fresh database has no members, and
      # sign-in needs one. Put YOUR work email at the Render prompt: the app
      # creates it as an ADMIN on boot, and you add the rest of the committee
      # in Settings. Setting it again later also restores admin rights if they
      # are ever lost.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

      # --- Sign-in -------------------------------------------------------
      # Pick your name from the committee list. The coordinator manages who is
      # on that list in Settings.
      - key: AUTH_MODE
        value: email
      # Set to "true" if you would rather people add themselves on first visit.
      # Off by default because a new scorer's submissions count toward the
      # average and the minimum-responses gate.
      - key: ALLOW_SELF_REGISTRATION
        value: "false"

      # To move to Microsoft 365 SSO later:
      #   1. set AUTH_MODE=entra
      #   2. add ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET
      #   3. set ENTRA_REDIRECT_URI to https://<your-host>/auth/callback
      #      (and register that exact URI on the app registration)
      # The server refuses to start on AUTH_MODE=entra with the registration
      # missing, so a half-finished switch fails loudly rather than quietly.
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
      # Restricts sign-in to your own domain(s), comma separated, once SSO is on.
      - key: ENTRA_ALLOWED_EMAIL_DOMAINS
        sync: false

      # --- JIRA ----------------------------------------------------------
      # A service account and API token - never a personal login. Once these
      # are set, "Import from JIRA" and "Write scores to JIRA" go live, and
      # Settings → JIRA → "Resolve field ids" finds the customfield ids for you.
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false

      # --- Email -----------------------------------------------------------
      # SMTP is the route that needs no approval from anyone. Sign up with any
      # provider (Brevo, SendGrid, Mailgun, Postmark, or Gmail with an app
      # password), verify the single address you will send from, and set these
      # four in the Render dashboard. Distribution and reminders go live
      # immediately - no redeploy, no code change.
      #
      #   SMTP_HOST   smtp-relay.brevo.com / smtp.sendgrid.net / smtp.gmail.com
      #   SMTP_PORT   587
      #   SMTP_USER   your login for that provider
      #   SMTP_PASS   the API key or app password
      #   EMAIL_FROM  the address you verified with the provider
      #
      # Sending *as* a company domain additionally needs SPF/DKIM DNS records
      # on that domain. Sending from an address you control does not - set
      # EMAIL_REPLY_TO so replies come back to the coordinator.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Business Impact Scoring
      - key: EMAIL_REPLY_TO
        sync: false
      # Set to "false" to compose and log messages without sending them, for
      # rehearsing the cadence.
      - key: EMAIL_SEND_ENABLED
        value: "true"

      # Microsoft Graph is the alternative, if an app registration with
      # Mail.Send ever does arrive. Setting these switches provider
      # automatically; SMTP takes precedence when both are present.
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_SENDER_UPN
        sync: false

      # --- Card drafting ---------------------------------------------------
      # Optional. Without a key, cards are drafted from the headings in the JIRA
      # description - fine for a ticket written in sections, thin for one that
      # is not. With a key, the whole ticket is read and the card is written in
      # business language, which is what the committee actually needs.
      #
      #   ANTHROPIC_API_KEY  from console.anthropic.com → API keys (paid,
      #                      pennies per card, card payment, no IT involved)
      #
      # Only the ticket's own text is sent - no scores, no committee names, no
      # round data. Every draft still lands in the editor for a coordinator to
      # check before it goes anywhere near the committee. Set AI_DRAFT_ENABLED
      # to "false" to fall back to the heading parser without removing the key.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DRAFT_ENABLED
        value: "true"

      # --- Automation ------------------------------------------------------
      # The app can run the weekly cycle itself - create the round, distribute
      # it, chase, close, finalise, write to JIRA. It is switched on in
      # Settings, not here, and every step is separate and off until you say so.
      #
      # This only stops the instance ticking at all. The honest use for it is
      # running more than one instance, where exactly one should drive the
      # cycle. On a single service, leave it alone.
      - key: SCHEDULER_ENABLED
        value: "true"

      # --- Sample data ---------------------------------------------------
      # The instance starts clean, as agreed (§12.5). To pre-fill a sample round
      # for a walkthrough, add SEED_ON_BOOT=demo in the Render dashboard, deploy
      # once, then remove it. It only ever seeds a database with no rounds in it.

      # Render injects PORT and RENDER_EXTERNAL_URL; the app reads both, so
      # links in generated email point at the deployed host automatically.
